<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experiment 4</title>
</head>
<body>
    <fieldset>
        <form align="center" alaction="#" target="_self" name="Hotel booking form" method="get">
            <h1>Hotel Room Booking Form</h1>
            <label for="Name">Full Name:</label>
            <input type="text" name="Name" id="Name" required>
            <br><br>
            <label for="Email">Email:</label>
            <input type="Email" name="Email" id="Email" required>
            <br><br>
            <label for="Phone">Phone:</label>
            <input type="number" name="Phone" id="Phone" required>
            <br><br>
            <label for="Check in">Check-in Date:</label>
            <input type="date" name="Check in" id="Check in">
            <br><br>
            <label for="Check out">Check-out Date:</label>
            <input type="date" name="Check in" id="Check out">
            <br><br>
            <label for="Room">Room Type:</label>
            <select name="Room" id="Room">
                <option value="Single Room">Single Room</option>
                <option value="Double Room">Double Room</option>
            </select>
            <br><br>
            <label for="Guest Number">Number Of Guest:</label>
            <input type="number" name="Guest Number" id="Guest Number">
            <br><br>
            <label for="requests">Special Requests:</label>
            <br>
            <textarea name="requests" id="requests"></textarea>
            
            <br><br>
            <button>Book Now</button>
            <button>Reset Form</button>
            

        </form>
    </fieldset>
    
</body>
</html>
